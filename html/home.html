<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Disney Cards</title>

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/card.css">
</head>

<body>

  <nav>
    <div class="logo">Lorcana</div>
    <ul>
      <li><a href="../html/home.html">Home</a></li>
      <li><a href="../html/setting.html">Settings</a></li>
      <li><button class="dark-toggle" id="darkToggle">🌙</button></li>
    </ul>
  </nav>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search for a character..." />

  <!-- SEARCH TITLE (JS updates this) -->
  <h2 id="searchTitle" style="text-align:center;"></h2>

  <!-- SEARCH RESULTS -->
  <div id="search-result"></div>

  <!-- MAIN TITLE -->
  <h1>Random Disney Cards</h1>

  <!-- MAIN CARD GRID -->
  <div id="cardContainer"></div>

  <!-- PAGINATION (JS GENERATES BUTTONS HERE) -->
  <div id="pagination"></div>

  <!-- BACK TO TOP -->
  <button id="backToTop" title="Back to Top">⬆️</button>

  <!-- SCRIPTS -->
  <script src="../js/darkmode.js"></script>
  <script src="../js/disney.js"></script>
  <script src="../js/backToTop.js"></script>

</html>
